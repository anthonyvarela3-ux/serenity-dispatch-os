<!DOCTYPE html>
<html lang="en" class="bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Apple iPadOS & iOS Standalone PWA Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Serenity OS">
  <meta name="theme-color" content="#020617">
  <title>Serenity Dispatch OS - Commercial NEMT Platform</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Leaflet Interactive Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            serenity: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              900: '#134e4a',
              950: '#042f2e',
            }
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #253347; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3b4e68; }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.85; }
      50% { transform: scale(1.2); opacity: 0.25; }
      100% { transform: scale(0.95); opacity: 0.85; }
    }
    .live-pulse { animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .dispatch-card { background: linear-gradient(180deg, rgba(22, 30, 46, 0.85) 0%, rgba(15, 23, 42, 0.95) 100%); }
    html, body { -webkit-text-size-adjust: 100%; -webkit-overflow-scrolling: touch; min-height: 100vh; position: relative; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body.drive-locked { height: 100vh !important; max-height: 100vh !important; overflow: hidden !important; touch-action: none !important; user-select: none !important; -webkit-user-select: none !important; }
    #cockpit-map-wrapper { isolation: isolate; position: relative; z-index: 1; contain: layout style; }
    .leaflet-container { z-index: 10 !important; background: #020617 !important; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased flex flex-col selection:bg-teal-500 selection:text-white pb-14">

  <!-- TOP DISPATCH CONTROL BAR -->
  <header class="border-b border-slate-800/90 bg-slate-900/95 sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-2">
      <!-- Row 1: Logo & Branding, Live Clock & Status, View Mode Toggles -->
      <div class="flex items-center justify-between gap-2 pb-2 border-b border-slate-800/60 flex-wrap">
        <div class="flex items-center space-x-3">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-teal-600 via-teal-500 to-emerald-400 flex items-center justify-center shadow-lg shadow-teal-500/20 text-slate-950 font-black text-lg">
            <i class="fa-solid fa-van-shuttle"></i>
          </div>
          <div>
            <div class="flex items-center space-x-2">
              <span class="text-base sm:text-lg font-extrabold tracking-tight text-white">Serenity <span class="text-teal-400">Dispatch OS</span></span>
              <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-teal-500/10 text-teal-300 border border-teal-500/30">v6 COMMERCIAL</span>
            </div>
            <p class="text-[10px] sm:text-[11px] text-slate-400">Independent NEMT Operations &bull; Long Island, NY (Suffolk County)</p>
          </div>
        </div>

        <div class="flex items-center space-x-2.5 text-sm">
          <div class="flex items-center space-x-2 bg-slate-950/80 px-2.5 py-1 rounded-lg border border-slate-800">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 live-pulse"></span>
            <span class="text-xs text-slate-300 font-medium">Clock: <strong class="text-teal-300 font-mono" id="clock-display">--:--:--</strong></span>
          </div>
          <div class="text-xs text-slate-400 hidden sm:block">
            <span class="text-slate-500">Depot:</span> <span class="text-slate-200 font-medium font-mono">Van #104</span>
          </div>
        </div>

        <!-- 3-Way Mode Switcher: Cockpit | Roster | Settings -->
        <div class="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800 shadow-inner">
          <button id="btn-mode-cockpit" type="button" class="px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 bg-teal-600 text-white shadow-md cursor-pointer" onclick="toggleViewMode('cockpit')">
            <i class="fa-solid fa-plane-up text-xs"></i>
            <span>Cockpit View</span>
          </button>
          <button id="btn-mode-roster" type="button" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition flex items-center space-x-1.5 cursor-pointer" onclick="toggleViewMode('roster')">
            <i class="fa-solid fa-table-list text-xs"></i>
            <span>Classic Roster</span>
          </button>
          <button id="btn-mode-settings" type="button" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-amber-300 hover:text-white transition flex items-center space-x-1.5 cursor-pointer" onclick="toggleViewMode('settings')">
            <i class="fa-solid fa-gear text-xs"></i>
            <span>Settings Deck</span>
          </button>
        </div>
      </div>

      <!-- Row 2: Action Toolbar -->
      <div class="flex items-center space-x-2 overflow-x-auto no-scrollbar pt-2 pb-0.5 text-xs">
        <button id="btn-clock-toggle" type="button" onclick="toggleDriverClock()" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white shadow-md transition flex items-center space-x-1.5 cursor-pointer shrink-0">
          <i class="fa-solid fa-business-time text-xs" id="clock-btn-icon"></i>
          <span id="clock-btn-label">Clock In</span>
          <span id="clock-elapsed-badge" class="hidden text-[10px] font-mono px-1.5 py-0.2 rounded bg-black/40 text-emerald-200 font-bold ml-1">0.0h</span>
        </button>

        <button type="button" onclick="openAskGeminiDrawer()" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white shadow-md transition flex items-center space-x-1.5 cursor-pointer shrink-0">
          <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
          <span>Ask Gemini AI</span>
        </button>

        <button type="button" onclick="openCorrectionsReportModal()" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-500/30 transition flex items-center space-x-1 cursor-pointer shrink-0">
          <i class="fa-solid fa-file-signature text-amber-400 text-xs"></i>
          <span>Corrections</span>
          <span class="px-1.5 py-0.2 rounded-full bg-amber-500/20 text-amber-300 font-mono text-[10px] font-bold" id="corrections-badge-count">0</span>
        </button>

        <button type="button" onclick="toggleDriveLock()" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition flex items-center space-x-1 cursor-pointer shrink-0">
          <i class="fa-solid fa-lock text-slate-400 text-xs" id="icon-drive-lock"></i>
          <span id="label-drive-lock">Drive Lock</span>
        </button>

        <button type="button" onclick="forceHardRefresh()" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-teal-300 border border-teal-500/30 transition flex items-center space-x-1 cursor-pointer shrink-0">
          <i class="fa-solid fa-rotate text-teal-400 text-xs"></i>
          <span>Refresh</span>
        </button>

        <button type="button" onclick="confirmResetManifest()" class="px-2.5 py-1.5 text-xs font-bold rounded-lg bg-rose-950/80 hover:bg-rose-900 text-rose-300 border border-rose-500/50 transition flex items-center space-x-1.5 cursor-pointer shrink-0">
          <i class="fa-solid fa-trash-can text-xs text-rose-400"></i>
          <span>Reset Manifest</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 space-y-6 flex-1 w-full">

    <!-- METRICS GRID -->
    <section aria-label="Operational Metrics">
      <div id="metrics-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3.5">
        <div class="dispatch-card border border-slate-800 rounded-xl p-4 shadow-sm">
          <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Runs</div>
          <div class="mt-2 flex items-baseline space-x-2">
            <span class="text-2xl font-bold font-mono text-white" id="metric-total-runs">7</span>
            <span class="text-xs text-teal-400 font-medium" id="metric-completed-runs">0 Done</span>
          </div>
          <p class="text-[11px] text-slate-500 mt-1">Live NEMT roster</p>
        </div>

        <div class="dispatch-card border border-slate-800 rounded-xl p-4 shadow-sm">
          <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Expected Miles</div>
          <div class="mt-2 flex items-baseline space-x-2">
            <span class="text-2xl font-bold font-mono text-white" id="metric-total-miles">155.4</span>
            <span class="text-xs text-slate-400 font-mono">mi</span>
          </div>
          <p class="text-[11px] text-slate-400 mt-1">76.8 loaded &bull; 78.6 deadhead</p>
        </div>

        <div class="dispatch-card border border-slate-800 rounded-xl p-4 shadow-sm">
          <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Driver Hours</div>
          <div class="mt-2 flex items-baseline space-x-2">
            <span class="text-2xl font-bold font-mono text-white" id="metric-driver-hours">7.09</span>
            <span class="text-xs text-slate-400 font-mono">hrs</span>
          </div>
          <p class="text-[11px] text-slate-500 mt-1">Garage-to-garage shift</p>
        </div>

        <div class="dispatch-card border border-slate-800 rounded-xl p-4 shadow-sm">
          <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Labor Pay</div>
          <div class="mt-2 flex items-baseline space-x-2">
            <span class="text-2xl font-bold font-mono text-white" id="metric
