  <style>
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090d16;
    }
    ::-webkit-scrollbar-thumb {
      background: #253347;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3b4e68;
    }
    /* Pulsing radar for Live status */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.85; }
      50% { transform: scale(1.2); opacity: 0.25; }
      100% { transform: scale(0.95); opacity: 0.85; }
    }
    .live-pulse {
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    /* Subtle neon scanline for dispatch terminal feel */
    .dispatch-card {
      background: linear-gradient(180deg, rgba(22, 30, 46, 0.85) 0%, rgba(15, 23, 42, 0.95) 100%);
    }

    /* =======================================================
       IN-CAB TABLET APP LOCK (Zero Screen Jiggle & Static Lock)
       Eliminates iOS / Android rubber-band bounce, horizontal sway,
       and accidental blue text-selection boxes on touch.
       ======================================================= */
    /* High-Performance Mobile & Tablet Native Momentum Scrolling */
    html {
      -webkit-text-size-adjust: 100%;
      -webkit-overflow-scrolling: touch;
    }
    body {
      min-height: 100vh;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      -webkit-overflow-scrolling: touch;
    }
    /* Hide scrollbar for clean horizontal toolbars while keeping them fully scrollable */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    input, textarea, [contenteditable="true"] {
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    /* Isolated Stacking Context for Leaflet Map
       Traps Leaflet internal z-indices (z-400 to z-1000) inside level 1,
       guaranteeing modals (z-9999) ALWAYS sit cleanly on top without bleeding through. */
    /* Mobile GPU & Native Hardware Scrolling */
    html, body {
      -webkit-overflow-scrolling: touch;
    }
    /* Fluid modal scrolling */
    #modal-ride-focus, #modal-parser, #modal-settings, #modal-location-correction, #modal-corrections-report, #modal-gps-radar {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    #modal-ride-focus > div, #modal-parser > div, #modal-settings > div, #modal-location-correction > div, #modal-corrections-report > div {
      -webkit-overflow-scrolling: touch;
    }

    /* In-Cab Driving Lock (Rigid Viewport Kiosk Mode) */
    body.drive-locked {
      height: 100vh !important;
      max-height: 100vh !important;
      overflow: hidden !important;
      touch-action: none !important;
      user-select: none !important;
      -webkit-user-select: none !important;
    }

    #cockpit-map-wrapper {
      isolation: isolate;
      position: relative;
      z-index: 1;
      contain: layout style;
    }
    #cockpit-leaflet-map, #focus-ride-leaflet-map {
      touch-action: pan-y !important;
    }
  
    /* =======================================================
       UNIVERSAL AUTO-FIT WINDOW ENGINE FOR PIXEL & MOBILE SCREENS
       Automatically sizes and adapts EVERY modal window to 100% 
       of the screen on phones (Pixel, iPhone) while maintaining 
       comfortable, centered floating dialogs on iPads and desktops.
       ======================================================= */
    html {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }
    body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-overflow-scrolling: touch;
    }

    main {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    /* Universal Modal Wrapper Rules */
    div[id^="modal-"] {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      max-height: 100dvh !important;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch !important;
      overscroll-behavior: contain !important;
    }

    /* Mobile Phones (< 640px, e.g. Google Pixel in portrait):
       Auto-fit full screen edge-to-edge like a native mobile app screen */
    @media (max-width: 640px) {
      div[id^="modal-"] {
        padding: 0 !important;
        align-items: stretch !important;
        justify-content: stretch !important;
      }

      div[id^="modal-"] > div {
        width: 100% !important;
        max-width: 100vw !important;
        min-width: 100% !important;
        min-height: 100vh !important;
        min-height: 100dvh !important;
        height: 100% !important;
        max-height: 100vh !important;
        max-height: 100dvh !important;
        border-radius: 0 !important;
        border: none !important;
        margin: 0 !important;
        padding: 1rem 0.875rem !important;
        box-shadow: none !important;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch !important;
      }

      /* Make modal headers sticky on mobile so close button is always reachable */
      div[id^="modal-"] > div > div:first-child {
        position: sticky;
        top: 0;
        z-index: 30;
        background-color: inherit;
        padding-top: 0.25rem;
        padding-bottom: 0.75rem;
      }
    }

    /* Tablets & iPads (641px - 1024px):
       Centered floating card with maximum screen utilization */
    @media (min-width: 641px) and (max-width: 1024px) {
      div[id^="modal-"] {
        padding: 1rem !important;
      }
      div[id^="modal-"] > div {
        width: 95% !important;
        max-width: 720px !important;
        max-height: 94vh !important;
        max-height: 94dvh !important;
        border-radius: 1.25rem !important;
        margin: auto !important;
      }
    }

  </style>

<body class="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased flex flex-col selection:bg-teal-500 selection:text-white pb-14">
  <!-- Full-Page Drag & Drop Overlay (Allows dropping manifest screenshots directly onto the live site) -->
  <div id="fullpage-drop-overlay" class="fixed inset-0 z-[9998] bg-slate-950/90  border-4 border-dashed border-teal-400 hidden flex flex-col items-center justify-center p-6 text-center pointer-events-none">

  </div>

            <i class="fa-solid fa-van-shuttle"></i>
          </div>
          <div>
            <div class="flex items-center space-x-2">

              <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-teal-500/10 text-teal-300 border border-teal-500/30">NEMT PRO</span>
            </div>
            <p class="text-[10px] sm:text-[11px] text-slate-400">Independent NEMT Operations &bull; Long Island, NY (Suffolk County)</p>
          </div>

        <!-- Center Status & Clock -->

            <i class="fa-solid fa-user-circle text-teal-400 text-sm"></i>
            <span id="header-driver-label">Anthony &bull; Van #104</span>

        <!-- Cockpit vs Roster View Mode Toggle -->

      <!-- Row 2: Tactical Action Toolbar (Smooth horizontal scroll strip on tablet/mobile with zero overflow clipping) -->

        <!-- 1-Tap Hard Refresh / Cache Buster -->
        <button id="btn-force-refresh" type="button" onclick="forceHardRefresh()" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-teal-300 border border-teal-500/30 transition flex items-center space-x-1 cursor-pointer shrink-0" title="Force iPad to reload latest Cloudflare build past cache">
          <i class="fa-solid fa-rotate text-teal-400 text-xs"></i>

        <!-- In-Cab Driving Lock Toggle -->

        <button id="btn-clear-manifest-header" class="px-2.5 py-1.5 text-xs font-bold rounded-lg bg-rose-950/80 hover:bg-rose-900 text-rose-300 border border-rose-500/50 shadow-md shadow-rose-950/60 transition flex items-center space-x-1.5 cursor-pointer shrink-0" title="Wipe out old runs and clear board for a new day">
