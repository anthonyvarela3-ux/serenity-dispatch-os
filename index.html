<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Serenity Dispatch OS - Master Daily Overview</title>
  <style>
    :root {
      --bg-base: #04070f;
      --bg-panel: #0d162d;
      --bg-card: #121e3a;
      --border-panel: #1e315e;
      --accent-blue: #0ea5e9;
      --accent-amber: #f59e0b;
      --accent-indigo: #6366f1;
      --accent-emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* TOP HEADER */
    .top-header {
      background: #070d1d;
      border-bottom: 2px solid var(--border-panel);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-title { font-size: 16px; font-weight: 900; color: #38bdf8; }
    .brand-sub { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; }

    .deck-viewport {
      flex: 1; max-width: 960px; width: 100%; margin: 0 auto; padding: 14px;
      display: flex; flex-direction: column; gap: 14px;
    }

    /* MASTER OVERVIEW CARD */
    .overview-card {
      background: var(--bg-panel);
      border: 2px solid var(--border-panel);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .overview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .overview-title { font-size: 14px; font-weight: 900; color: #38bdf8; text-transform: uppercase; }

    /* MANIFEST RUN ROW */
    .run-row {
      background: #0a1124;
      border: 1px solid #1e315e;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .run-row:hover { border-color: #38bdf8; }
    .run-row-active { border: 2px solid #0ea5e9; background: #0f1d3d; }
    .run-name { font-size: 15px; font-weight: 900; color: #fff; }
    .run-meta { font-size: 12px; color: #94a3b8; margin-top: 3px; }
    .run-badge { font-size: 12px; font-weight: 900; text-align: right; }

    .staging-banner {
      background: #1e1b4b;
      border: 2px dashed #6366f1;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 800;
      color: #c7d2fe;
    }

    /* DRILL-DOWN POP-UP MODAL */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px); z-index: 200; display: none;
    }
    .modal-sheet {
      position: fixed; bottom: 0; left: 0; width: 100%; max-height: 85vh;
      background: #0d162d; border-top: 2px solid var(--border-panel); border-radius: 20px 20px 0 0;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.8); z-index: 210; display: flex; flex-direction: column;
      transform: translateY(100%); transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); padding: 20px;
    }
    .modal-sheet.open { transform: translateY(0); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-title { font-size: 18px; font-weight: 900; color: #38bdf8; text-transform: uppercase; }
    .btn-modal-close { background: #1e293b; border: none; color: #cbd5e1; width: 36px; height: 36px; border-radius: 18px; font-size: 18px; font-weight: 900; cursor: pointer; }

    .detail-box { background: #121e3a; border: 1px solid var(--border-panel); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .detail-label { font-size: 11px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
    .detail-value { font-size: 15px; font-weight: 700; color: #fff; }

    .btn-action-primary {
      width: 100%; height: 54px; background: #0284c7; border: 2px solid #38bdf8; border-radius: 12px;
      color: #fff; font-size: 15px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; margin-top: 8px;
    }
    .btn-action-amber { background: #d97706; border: 2px solid #fbbf24; }
  </style>
</head>
<body>

  <header class="top-header">
    <div>
      <div class="brand-title">SERENITY DISPATCH OS</div>
      <div class="brand-sub">Suffolk County NEMT &amp; Private Fleet • Master Overview</div>
    </div>
    <div style="background:#172544; border:1px solid #38bdf8; color:#38bdf8; border-radius:14px; padding:6px 12px; font-size:12px; font-weight:800;">
      👤 Anthony • Van #104
    </div>
  </header>

  <main class="deck-viewport">

    <!-- MASTER DAILY OVERVIEW DECK -->
    <section class="overview-card">
      <div class="overview-header">
        <div class="overview-title">📅 Today's Complete Slate (RoutingBox Synced)</div>
        <button onclick="openUploadModal()" style="background:#0ea5e9; color:#fff; border:none; padding:6px 12px; border-radius:8px; font-weight:900; font-size:12px; cursor:pointer;">+ Import Manifest</button>
      </div>

      <div id="masterManifestList" style="display:flex; flex-direction:column; gap:8px;">
        <!-- Injected via JS -->
      </div>

      <div class="staging-banner">
        <span>⛽ Midday Staging Gap: Standby at 1480 5th Ave Base Depot</span>
        <span style="color: #a5b4fc;">Saves 4.2 Gal Fuel</span>
      </div>
    </section>

  </main>

  <!-- DRILL-DOWN POP-UP MODAL (Page Two Logic) -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="closeModal()"></div>
  <aside class="modal-sheet" id="modalSheet">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Run Details &amp; Execution</div>
      <button class="btn-modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody" style="overflow-y:auto; display:flex; flex-direction:column; gap:4px;">
      <!-- Dynamic Run Particulars -->
    </div>
  </aside>

  <script>
    const runs = [
      { id: "MAS #91824", name: "1. Harold Jenkins (MAS Medicaid)", pickup: "320 Carlton Ave, Central Islip, NY", dropoff: "South Shore University Hospital, Bay Shore", time: "08:45 AM", status: "ACTIVE", stage: "Stage 1: In Route", phone: "631-555-0192", notes: "Gate Code: #4812 (Dialysis Rear Bay B). Foldable walker." },
      { id: "TAXI #1092", name: "2. Maria Santos (Serenity Taxi Livery)", pickup: "North Bay Shore Residential", dropoff: "Good Samaritan Hospital, West Islip", time: "10:15 AM", status: "QUEUED", stage: "Scheduled", phone: "631-555-0841", notes: "Private pay credit voucher. Curbside pickup near lobby." },
      { id: "MAS #91825", name: "3. Robert Chen (MAS Medicaid)", pickup: "Central Islip Senior Center", dropoff: "South Shore University Hospital, Bay Shore", time: "12:30 PM", status: "QUEUED", stage: "Scheduled", phone: "631-555-9120", notes: "Wheelchair lift accessible van required." }
    ];

    function renderMasterSlate() {
      const container = document.getElementById('masterManifestList');
      container.innerHTML = '';
      runs.forEach((r, idx) => {
        const isActive = r.status === 'ACTIVE';
        const div = document.createElement('div');
        div.className = `run-row ${isActive ? 'run-row-active' : ''}`;
        div.innerHTML = `
          <div>
            <div class="run-name">${r.name}</div>
            <div class="run-meta">Pickup: ${r.pickup} ➔ ${r.dropoff}</div>
          </div>
          <div class="run-badge" style="color: ${isActive ? '#0ea5e9' : '#94a3b8'};">
            ${r.time}<br>${r.status}
          </div>
        `;
        div.onclick = () => openRunModal(idx);
        container.appendChild(div);
      });
    }

    function openRunModal(idx) {
      const r = runs[idx];
      const sheet = document.getElementById('modalSheet');
      const backdrop = document.getElementById('modalBackdrop');
      document.getElementById('modalTitle').innerText = r.id + " • " + r.name;

      document.getElementById('modalBody').innerHTML = `
        <div class="detail-box">
          <div class="detail-label">Current Lifecycle Stage</div>
          <div class="detail-value" style="color:#38bdf8;">${r.stage}</div>
        </div>
        <div class="detail-box">
          <div class="detail-label">Pickup &amp; Dropoff Routing</div>
          <div class="detail-value">Pickup: ${r.pickup}<br>Dropoff: ${r.dropoff}</div>
        </div>
        <div class="detail-box">
          <div class="detail-label">Facility Gate &amp; Special Instructions</div>
          <div class="detail-value">${r.notes}</div>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px; margin-top:10px;">
          <a href="https://maps.google.com/?q=${encodeURIComponent(r.pickup)}" target="_blank" class="btn-action-primary">🗺️ Launch Native GPS Navigation</a>
          <a href="tel:${r.phone}" class="btn-action-primary btn-action-amber" style="text-decoration:none;">📞 Call Rider Directly (${r.phone})</a>
          <button class="btn-action-primary" style="background:#059669; border-color:#10b981;" onclick="alert('Curbside GPS Stamp Locked & Guardrail Verified!'); closeModal();">📍 Lock Curbside GPS Anchor</button>
        </div>
      `;

      backdrop.style.display = 'block';
      setTimeout(() => sheet.classList.add('open'), 10);
    }

    function openUploadModal() {
      const sheet = document.getElementById('modalSheet');
      const backdrop = document.getElementById('modalBackdrop');
      document.getElementById('modalTitle').innerText = "Upload Daily Manifest";

      document.getElementById('modalBody').innerHTML = `
        <div class="detail-box">
          <div class="detail-label">RoutingBox / Broker Import</div>
          <div class="detail-value" style="font-size:13px; color:#94a3b8;">Upload CSV or spreadsheet export from MAS or Modivcare.</div>
        </div>
        <input type="file" style="color:#fff; margin:14px 0;" />
        <button class="btn-action-primary" onclick="alert('Manifest CSV parsed successfully! Slate updated.'); closeModal();">⚡ Process Manifest File</button>
      `;

      backdrop.style.display = 'block';
      setTimeout(() => sheet.classList.add('open'), 10);
    }

    function closeModal() {
      const sheet = document.getElementById('modalSheet');
      sheet.classList.remove('open');
      setTimeout(() => { document.getElementById('modalBackdrop').style.display = 'none'; }, 250);
    }

    renderMasterSlate();
  </script>
</body>
</html>
