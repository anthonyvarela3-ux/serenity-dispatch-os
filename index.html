    <script>
        var STATE = {
            currentView: 'cockpit',
            shiftElapsedSeconds: 0,
            isClockedIn: false,
            driverLaborRate: 22.50,
            runs: [],
            activeRunIndex: -1,
            selectedLang: 'EN',
            lockedPhoneDirectory: {
                "Dispatcher Primary": "631-555-0100"
            }
        };

        var MACROS = {
            EN: {
                eta: "Hi {NAME}, this is Anthony from Serenity Medical Transport. I am en route and will arrive in approximately 10 minutes.",
                early: "Hi {NAME}, running slightly ahead of schedule. Expected arrival in 5 minutes.",
                atCurb: "Serenity Transport is at the curb for {NAME} at {ADDR}."
            },
            ES: {
                eta: "Hola {NAME}, le habla Anthony de Serenity Medical Transport. Estoy en camino y llegaré en aproximadamente 10 minutos.",
                early: "Hola {NAME}, voy un poco adelantado. Llegada estimada en 5 minutos.",
                atCurb: "Serenity Transport está esperando en la acera para {NAME} en {ADDR}."
            }
        };

        function updateClockDisplay() {
            var now = new Date();
            var timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
            var clockEl = document.getElementById('clockDisplay');
            if (clockEl) {
                clockEl.innerText = timeStr;
            }

            if (STATE.isClockedIn) {
                STATE.shiftElapsedSeconds++;
                updateLaborMetrics();
            }
        }

        function toggleShiftClock() {
            var btn = document.getElementById('btnClockIn');
            if (!STATE.isClockedIn) {
                STATE.isClockedIn = true;
                if (btn) {
                    btn.innerText = 'Clock Out';
                    btn.className = 'btn btn-red';
                }
            } else {
                STATE.isClockedIn = false;
                if (btn) {
                    btn.innerText = 'Clock In';
                    btn.className = 'btn btn-green';
                }
            }
        }

        function updateLaborMetrics() {
            var hours = STATE.shiftElapsedSeconds / 3600;
            var laborCost = hours * STATE.driverLaborRate;
            var laborEl = document.getElementById('metricLabor');
            if (laborEl) {
                laborEl.innerText = '$' + laborCost.toFixed(2);
            }
        }

        function updateLaborRate() {
            var input = document.getElementById('cfgLaborRate');
            if (input && !isNaN(parseFloat(input.value))) {
                STATE.driverLaborRate = parseFloat(input.value);
                updateLaborMetrics();
            }
        }

        function switchView(viewName) {
            STATE.currentView = viewName;
            var views = ['cockpit', 'roster', 'upload', 'settings'];
            for (var i = 0; i < views.length; i++) {
                var v = views[i];
                var panel = document.getElementById('view' + v.charAt(0).toUpperCase() + v.slice(1));
                var navBtn = document.getElementById('nav' + v.charAt(0).toUpperCase() + v.slice(1));
                if (panel) panel.classList.remove('active');
                if (navBtn && v !== 'settings') navBtn.className = 'btn btn-cyan';
            }

            var activePanel = document.getElementById('view' + viewName.charAt(0).toUpperCase() + viewName.slice(1));
            var activeNavBtn = document.getElementById('nav' + viewName.charAt(0).toUpperCase() + viewName.slice(1));
            if (activePanel) activePanel.classList.add('active');
            if (activeNavBtn && viewName !== 'settings') activeNavBtn.className = 'btn btn-cyan-active';

            renderApp();
        }

        function triggerFileInput() {
            var input = document.getElementById('manifestFileInput');
            if (input) input.click();
        }

        function handleFileSelected(event) {
            var files = event.target.files;
            if (files && files.length > 0) {
                processFilesSequentially(Array.from(files));
            }
        }

        async function processFilesSequentially(files) {
            var badge = document.getElementById('fileStatusBadge');
            for (var idx = 0; idx < files.length; idx++) {
                var file = files[idx];
                if (badge) {
                    badge.style.display = 'inline-block';
                    badge.innerText = `Processing ${idx + 1} of ${files.length}: ${file.name}...`;
                }

                if (file.type.star
