<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Serenity Dispatch OS - Master Fleet Deck</title>
  <style>
    :root {
      --bg-base: #050810;
      --bg-panel: #0b1325;
      --bg-card: #101b33;
      --border-panel: #1b2c4f;
      --accent-blue: #0ea5e9;
      --accent-amber: #f59e0b;
      --accent-emerald: #10b981;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 8px;
    }

    /* TOP DISPATCH HEADER BAR */
    .top-bar {
      background: var(--bg-panel);
      border: 1px solid var(--border-panel);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .brand-col { display: flex; flex-direction: column; }
    .brand-title { font-size: 15px; font-weight: 900; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    .brand-badge { background: #0369a1; color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: 800; }
    .brand-sub { font-size: 9px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }

    .control-pills { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .pill {
      background: #172544; border: 1px solid var(--border-panel); border-radius: 6px;
      padding: 5px 8px; font-size: 10px; font-weight: 800; color: #cbd5e1; cursor: pointer;
    }
    .pill-green { background: #064e3b; border-color: #059669; color: #34d399; }
    .pill-amber { background: #78350f; border-color: #d97706; color: #fbbf24; }
    .pill-gemini { background: #3b82f6; border-color: #60a5fa; color: #fff; }

    /* FINANCIAL METRICS ROW */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    @media(max-width: 768px) { .metrics-grid { grid-template-columns: 1fr; } }
    .metric-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-panel);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .metric-label { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
    .metric-val { font-size: 20px; font-weight: 900; color: #fff; }
    .metric-sub { font-size: 10px; font-weight: 700; color: var(--text-muted); }

    /* SHIFT BANNER */
    .shift-banner {
      background: #090e1a; border: 1px solid var(--border-panel); border-radius: 8px;
      padding: 8px 12px; display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; font-size: 11px; font-weight: 800; color: #cbd5e1; gap: 6px;
    }

    /* MANIFEST & ROUTE TABLE (MASTER OVERVIEW) */
    .manifest-section {
      background: var(--bg-panel);
      border: 2px solid var(--border-panel);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .section-header {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px;
    }
    .section-title { font-size: 13px; font-weight: 900; color: #38bdf8; text-transform: uppercase; }

    .table-container { display: flex; flex-direction: column; gap: 6px; }
    .manifest-row {
      background: var(--bg-card);
      border: 1px solid var(--border-panel);
      border-radius: 10px;
      padding: 10px;
      display: grid;
      grid-template-columns: 100px 1fr 100px 1.4fr 100px 120px;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .manifest-row.completed { opacity: 0.5; border-color: #064e3b; background: #061a14; }
    .manifest-row.active-run {
      border: 2px solid #38bdf8;
      background: #0f1d36;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }
    .manifest-row:hover { border-color: #38bdf8; }
    @media(max-width: 950px) {
      .manifest-row { grid-template-columns: 1fr; gap: 6px; }
    }

    .status-badge {
      background: #064e3b; color: #34d399; border: 1px solid #059669; border-radius: 5px;
      padding: 3px 6px; font-size: 10px; font-weight: 900; text-align: center; text-transform: uppercase;
    }
    .status-badge.done { background: #1e293b; color: var(--text-muted); border-color: #334155; }
    .status-badge.active { background: #0369a1; color: #e0f2fe; border-color: #0ea5e9; }
    
    .btn-call {
      background: #0284c7; color: #fff; border: none; border-radius: 5px;
      padding: 4px; font-size: 10px; font-weight: 900; cursor: pointer; text-align: center; text-decoration: none; margin-top: 3px; display: block;
    }
    .p-name { font-size: 14px; font-weight: 900; color: #fff; }
    .p-phone { font-size: 11px; color: var(--text-muted); font-weight: 700; }
    .sched-pu { color: #38bdf8; font-size: 13px; font-weight: 900; }
    .corr-title { font-weight: 900; color: #cbd5e1; font-size: 11px; }
    .corr-addr { color: var(--text-muted); font-size: 10px; font-weight: 700; line-height: 1.2; }
    .rev-amount { font-size: 15px; font-weight: 900; color: #34d399; text-align: right; }
    .rev-rate { font-size: 10px; color: var(--text-muted); font-weight: 700; text-align: right; }
    .action-pills-row { display: flex; gap: 4px; justify-content: flex-end; }
    .action-btn {
      background: #1e293b; border: 1px solid #334155; border-radius: 5px;
      padding: 5px 8px; font-size: 10px; font-weight: 900; color: #cbd5e1; cursor: pointer;
    }
    .action-btn.active { background: #059669; border-color: #10b981; color: #fff; }

    /* DOWNTIME BANNER */
    .downtime-banner {
      background: #78350f; border: 1px solid #d97706; border-radius: 8px;
      padding: 8px 12px; display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; font-weight: 900; color: #fef3c7; flex-wrap: wrap; gap: 6px;
    }

    /* MODALS & DRAWERS */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); z-index: 200; display: none; }
    .modal-sheet {
      position: fixed; bottom: 0; left: 0; width: 100%; max-height: 92vh;
      background: var(--bg-panel); border-top: 2px solid var(--border-panel); border-radius: 18px 18px 0 0;
      z-index: 210; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); padding: 16px;
    }
    .modal-sheet.open { transform: translateY(0); }
    
    .drill-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border-panel); padding-bottom: 8px; }
    .drill-nav-controls { display: flex; align-items: center; gap: 8px; }
    .btn-nav-jump { background: #1e293b; border: 1px solid #334155; color: #38bdf8; padding: 4px 10px; border-radius: 6px; font-weight: 900; font-size: 12px; cursor: pointer; }
    .btn-drill-close { background: #1e293b; border: none; color: #fff; width: 32px; height: 32px; border-radius: 16px; font-size: 14px; font-weight: 900; cursor: pointer; }

    /* PING TOOLBAR */
    .ping-card {
      background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px;
    }
    .ping-toolbar { display: flex; gap: 6px; }
    .btn-ping { flex: 1; background: #1e293b; border: 1px solid #475569; border-radius: 6px; padding: 6px; font-size: 10px; font-weight: 900; color: #cbd5e1; cursor: pointer; text-align: center; }
    .btn-ping.selected { background: #d97706; border-color: #fbbf24; color: #000; }
    .ping-textbox { width: 100%; background: #020617; border: 1px solid #1e293b; border-radius: 6px; color: #fff; padding: 8px; font-size: 11px; resize: none; height: 50px; font-family: inherit; }
