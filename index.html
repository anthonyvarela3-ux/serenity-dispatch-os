<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Serenity Dispatch OS - V6 Production</title>
  
  <!-- On-Screen Mobile Debug Console (Floats in bottom-right corner) -->
  <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
  <script>
    if (typeof VConsole !== 'undefined') {
      window.vConsole = new VConsole();
    }
  </script>

  <style>
    :root {
      --bg-base: #050810;
      --bg-panel: #0b1325;
      --border-panel: #1b2c4f;
      --accent-blue: #0ea5e9;
      --accent-teal: #14b8a6;
      --accent-amber: #f59e0b;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-mono: Courier New, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 8px;
    }

    .top-bar {
      background: var(--bg-panel);
      border: 1px solid var(--border-panel);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 900;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-badge {
      background: #0369a1;
      color: #fff;
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 800;
    }

    .brand-sub {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .control-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    button.pill, a.pill {
      background: #172544;
      border: 1px solid var(--border-panel);
      border-radius: 7px;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 800;
      color: #cbd5e1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      touch-action: manipulation;
    }

    button.pill:active, a.pill:active {
      opacity: 0.75;
      transform: scale(0.97);
    }

    button.pill.active-tab {
      background: var(--accent-blue);
      border-color: #38bdf8;
      color: #fff;
    }

    button.pill-green, a.pill-green {
      background: #064e3b;
      border-color: #059669;
      color: #34d399;
    }

    button.pill-amber {
      background: #78350f;
      border-color: #d97706;
      color: #fbbf24;
    }

    button.pill-rose {
      background: #4c0519;
      border-color: #e11d48;
      color: #fda4af;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    @media(max-width: 1024px) { .metrics-grid { grid-template-columns: repeat(3, 1fr); } }
    @media(max-width: 540px) { .metrics-grid { grid-template-columns: repeat(2, 1fr); } }

    .metric-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-panel);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .metric-label {
      font-size: 10px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .metric-val {
      font-size: 20px;
      font-weight: 900;
      font-family: var(--font-mono);
      color: var(--text-main);
      margin-top: 4px;
    }

    .metric-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
      display: block;
    }

    .view-section {
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .view-section.active {
      display: flex;
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-panel);
      border-radius: 12px;
      padding: 12px;
    }

    .cockpit-grid {
      display: grid;
      grid-template-columns: 7fr 5fr;
      gap: 8px;
    }

    @media(max-width: 820px) { .cockpit-grid { grid-template-columns: 1fr; } }

    .leg-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    @media(max-width: 600px) { .leg-grid { grid-template-columns: 1fr; } }

    .leg-card {
      background: var(--bg-base);
      border: 1px solid var(--border-panel);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .leg-card.pickup { border-color: #0d9488; }
    .leg-card.dropoff { border-color: #e11d48; }

    .btn-action {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      color: #fff;
      touch-action: manipulation;
    }

    .btn-teal { background: #0d9488; }
    .btn-rose { background: #e11d48; }
    .btn-amber { background: #d97706; }
    .btn-emerald { background: #059669; }
    .btn-slate { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; }

    .input-field {
      width: 100%;
      background: var(--bg-base);
      border: 1px solid var(--border-panel);
      border-radius: 8px;
      padding: 9px 10px;
      color: var(--text-main);
      font-size: 12px;
      font-family: inherit;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: left;
    }

    th {
      background: var(--bg-base);
      color: var(--text-muted);
      padding: 10px;
      font-size: 10px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-panel);
    }

    td {
      padding: 10px;
      border-bottom: 1px solid var(--border-panel);
    }

    #status-banner {
      background: #064e3b;
      border: 1px solid #059669;
      color: #34d399;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      display: none;
    }
  </style>
</head>
<body>

  <div id="status-banner">System Ready</div>

  <!-- TOP DISPATCH CONTROL BAR -->
  <header class="top-bar">
    <div>
      <div class="brand-title">
        <span>SERENITY DISPATCH OS</span>
        <span class="brand
