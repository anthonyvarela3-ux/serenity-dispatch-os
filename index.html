<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Serenity Dispatch OS - Master Fleet Deck</title>
    <style>
        :root {
            --bg-base: #050810;
            --bg-panel: #0b1325;
            --bg-card: #101b33;
            --border-panel: #1b2c4f;
            --accent-blue: #0ea5e9;
            --accent-amber: #f59e0b;
            --accent-emerald: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .top-bar {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-panel);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand-title {
            font-size: 16px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 0.5px;
        }
        .status-badge {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-emerald);
            border: 1px solid var(--accent-emerald);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
        }
        .dashboard-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            padding: 16px;
        }
        @media (min-width: 768px) {
            .dashboard-container {
                grid-template-columns: 350px 1fr;
            }
        }
        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-panel);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel-header {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-panel);
            font-weight: 700;
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .dispatch-item, .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-panel);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .dispatch-item:last-child {
            margin-bottom: 0;
        }
        .dispatch-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .dispatch-id {
            font-weight: 700;
            color: var(--accent-blue);
        }
        .dispatch-status {
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .status-active { background: rgba(14, 165, 233, 0.1); color: var(--accent-blue); }
        .status-warning { background: rgba(245, 158, 11, 0.1); color: var(--accent-amber); }
        .dispatch-details {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .dispatch-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        button {
            background: var(--bg-base);
            border: 1px solid var(--border-panel);
            color: var(--text-main);
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            border-color: var(--accent-blue);
            color: #fff;
        }
        button.btn-primary {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #050810;
        }
        button.btn-primary:hover {
            background: #0284c7;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-card .value {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            margin-top: 4px;
        }
        .stat-card.alert .value { color: var(--accent-red); }
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #fff;
            color: #050810;
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 1000;
        }
        #toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <span class="brand-title">SERENITY DISPATCH OS</span>
        <span class="status-badge" id="system-status">SYSTEM OPERATIONAL</span>
    </div>

    <div class="dashboard-container">
        <div class="panel">
            <div class="panel-header">
                <span>Fleet Metrics</span>
                <span id="update-indicator">●</span>
            </div>
            <div class="scroll-area">
                <div class="stat-grid">
                    <div class="stat-card">
                        <div style="font-size: 11px; color: var(--text-muted);">Active Units</div>
                        <div class="value" id="active-units-val">0</div>
                    </div>
                    <div class="stat-card alert">
                        <div style="font-size: 11px; color: var(--text-muted);">Critical Alerts</div>
                        <div class="value" id="critical-alerts-val">0</div>
                    </div>
                </div>
                <div style="margin-top: 20px;">
                    <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">System Integrity</div>
                    <div style="background: var(--bg-card); height: 8px; border-radius: 4px; overflow: hidden;">
                        <div style="background: var(--accent-emerald); height: 100%; width: 100%;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span>Active Dispatches</span>
                <button onclick="clearManifestData()" style="padding: 2px 8px; font-size: 10px;">Purge Manifest</button>
            </div>
            <div class="scroll-area" id="dispatch-list">
            </div>
        </div>
    </div>

    <div id="toast">Manifest Cache Purged Clean</div>

    <script>
        const initialDispatches = [
            { id: "DISPATCH-101", priority: "active", client: "St. Jude Medical", details: "Patient Transport Scheduled. ETA 15 mins." },
            { id: "DISPATCH-102", priority: "warning", client: "Mercy General", details: "Urgent Courier Request. Route recalculating." },
            { id: "DISPATCH-103", priority: "active", client: "Oakridge Senior Living", details: "Routine Transfer. Driver en route." }
        ];

        function initDashboard() {
            const list = document.getElementById('dispatch-list');
            list.innerHTML = '';
            
            document.getElementById('active-units-val').innerText = initialDispatches.length;
            document.getElementById('critical-alerts-val').innerText = initialDispatches.filter(d => d.priority === 'warning').length;

            initialDispatches.forEach(item => {
                const card = document.createElement('div');
                card.className = 'dispatch-item';
                card.innerHTML = `
                    <div class="dispatch-header">
                        <span class="dispatch-id">${item.id}</span>
                        <span class="dispatch-status status-${item.priority}">${item.priority.toUpperCase()}</span>
                    </div>
                    <div class="dispatch-details">
                        <strong>${item.client}</strong><br>${item.details}
                    </div>
                    <div class="dispatch-actions">
                        <button onclick="triggerAction('${item.id}', 'route')">View Route</button>
                        <button class="btn-primary" onclick="triggerAction('${item.id}', 'update')">Update Status</button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function triggerAction(id, action) {
            console.log(`Action ${action} triggered for ${id}`);
        }

        function clearManifestData() {
            console.log('Purging manifest data...');
            const toast = document.getElementById('toast');
            toast.className = 'show';
            setTimeout(() => {
                toast.className = '';
            }, 3000);
        }

        window.onload = initDashboard;
    </script>
</body>
</html>
