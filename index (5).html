<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Serenity Dispatch OS - Master Fleet Deck</title>
  <style>
    :root {
      --bg-base: #050810;
      --bg-panel: #0b1325;
      --bg-card: #101b33;
      --border-panel: #1b2c4f;
      --accent-blue: #0ea5e9;
      --accent-amber: #f59e0b;
      --accent-emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 8px;
    }

    /* TOP DISPATCH HEADER BAR */
    .top-bar {
      background: var(--bg-panel);
      border: 1px solid var(--border-panel);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .brand-col { display: flex; flex-direction: column; }
    .brand-title { font-size: 15px; font-weight: 900; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    .brand-badge { background: #0369a1; color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: 800; }
    .brand-sub { font-size: 9px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }

    .control-pills { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .pill {
      background: #172544; border: 1px solid var(--border-panel); border-radius: 6px;
      padding: 5px 8px; font-size: 10px; font-weight: 800; color: #cbd5e1; cursor: pointer;
    }
    .pill-green { background: #064e3b; border-color: #059669; color: #34d399; }
    .pill-amber { background: #78350f; border-color: #d97706; color: #fbbf24; }

    /* FINANCIAL METRICS ROW */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    @media(max-width: 768px) { .metrics-grid { grid-template-columns: 1fr; } }
