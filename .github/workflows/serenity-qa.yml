name: Serenity Driver Chromium + WebKit QA
on:
  push:
    branches:
      - serenity-beta7-stabilization-qa
      - serenity-beta7-manifest-replace-date
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Run synthetic user journey tests
        run: npm run test:browser -- --reporter=line
      - name: Store failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-playwright-debug
          path: |
            test-results/
            playwright-report/
          retention-days: 3
